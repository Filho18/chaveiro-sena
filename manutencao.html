<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="robots" content="noindex">
<title>Serviço em pausa — Chaveiro Sena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #111111;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .barra {
    width: 48px;
    height: 4px;
    background: #FFC300;
    border-radius: 2px;
    margin: 0 auto 28px;
  }
  h1 {
    font-size: clamp(24px, 6vw, 32px);
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  p { color: #B5B5B5; font-size: 16px; }
  p + p { margin-top: 10px; }
  .marca {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid #2A2A2A;
    color: #6E6E6E;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="barra"></div>
    <h1>Serviço temporariamente em pausa</h1>
    <p>Este site está indisponível de momento.</p>
    <p>Voltamos em breve.</p>
    <p class="marca">Chaveiro Sena</p>
  </div>
</div>

</body>
</html>
